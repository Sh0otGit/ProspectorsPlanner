<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Review your conflict-free UTEP schedule and copy CRNs into Goldmine.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Your schedule | Prospector's Planner">
<meta property="og:description" content="Review your conflict-free UTEP schedule and copy CRNs into Goldmine.">
<meta property="og:type" content="website">
<title>Your schedule | Prospector's Planner</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="siteHeader"></header>

<nav class="sectionnav" id="sectionnav" aria-label="Progress"><div class="wrap" id="sectionnavInner"></div></nav>

<main id="main">
<div class="titleband">
  <div class="wrap">
    <div class="kicker">Step 5 of 5</div>
    <h1 id="schedHeading">Your schedule</h1>
    <p>Copy the CRN list into the Goldmine add or drop worksheet when your registration window
       opens.</p>
  </div>
</div>

<div class="body-area"><div class="wrap">
  <div class="sched-grid">
    <div>
      <div class="calwrap"><table class="cal" id="schedCal"></table></div>
      <div class="legend" id="schedLegend"></div>
      <div id="conflictNote"></div>
      <div class="stepnav">
        <button class="btn" id="backBtn">Back</button>
      </div>
    </div>
    <div>
      <div class="panel">
        <div class="phead">Registration worksheet</div>
        <div class="pad">
          <div id="crnList"></div>
          <div id="copyMsg" style="font-size:12.5px;color:var(--good);margin-top:9px;min-height:16px"></div>
        </div>
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="phead">Rate this tool</div>
        <div class="pad">
          <div class="note" style="margin-bottom:12px">Anonymous. Helps us learn what's working before this goes further.</div>
          <div class="starinput" id="reviewStars" role="radiogroup" aria-label="Star rating">
            <button type="button" class="star" data-star="1" aria-label="1 star">&#9733;</button>
            <button type="button" class="star" data-star="2" aria-label="2 stars">&#9733;</button>
            <button type="button" class="star" data-star="3" aria-label="3 stars">&#9733;</button>
            <button type="button" class="star" data-star="4" aria-label="4 stars">&#9733;</button>
            <button type="button" class="star" data-star="5" aria-label="5 stars">&#9733;</button>
          </div>
          <input type="text" class="revinput" id="reviewName" placeholder="Name (optional)" style="margin-top:12px">
          <textarea class="revinput" id="reviewText" placeholder="What worked, what didn't (optional)" rows="3" style="margin-top:8px"></textarea>
          <button class="btn sm primary" id="submitReview" style="margin-top:10px">Submit feedback</button>
          <div id="reviewMsg" style="font-size:12.5px;margin-top:9px;min-height:16px"></div>
        </div>
      </div>
    </div>
  </div>
</div></div></main>

<footer class="sitefoot" id="siteFooter"></footer>

<script>window.CURRENT_STEP = 5;</script>
<script src="js/app.js"></script>
<script src="js/page-schedule.js"></script>
</body>
</html>
