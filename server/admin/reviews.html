<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Reviews | Prospector's Planner Admin</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body data-admin-page="reviews">

<div id="adminHeader"></div>

<div class="admin-shell">
  <nav class="admin-nav" id="adminNav"></nav>

  <div class="statgrid">
    <div><div class="lab">Total reviews</div><div class="val" id="statCount">&mdash;</div></div>
    <div><div class="lab">Average rating</div><div class="val" id="statAvg">&mdash;</div></div>
    <div><div class="lab">With written feedback</div><div class="val" id="statWithText">&mdash;</div></div>
  </div>

  <div class="panel">
    <div class="phead">All feedback</div>
    <div class="pad" id="reviewsList">Loading&hellip;</div>
  </div>
</div>

<script src="/admin/js/admin-common.js"></script>
<script src="/admin/js/reviews.js"></script>
</body>
</html>
