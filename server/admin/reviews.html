<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews | Prospector's Planner Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto+Condensed:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div class="masthead">
  <div class="wrap">
    <a class="lockup" href="/admin/ingestion.html">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff8200" stroke-width="2.6" stroke-linecap="square">
          <path d="M3 6h18"/><path d="M3 12h11"/><path d="M3 18h15"/>
        </svg>
      </span>
      <span class="words">
        <span class="n">Prospector's Planner</span>
        <span class="u">Admin</span>
      </span>
    </a>
    <span class="spacer"></span>
    <span class="tag">Internal</span>
  </div>
</div>

<div class="admin-shell">
  <nav class="admin-nav">
    <a href="/admin/ingestion.html">Ingestion</a>
    <a href="/admin/reviews.html" class="on">Reviews</a>
    <a href="/admin/analytics.html">Analytics</a>
    <span class="spacer"></span>
    <button id="logoutBtn">Log out</button>
  </nav>

  <div class="statgrid">
    <div><div class="lab">Total reviews</div><div class="val" id="statCount">&mdash;</div></div>
    <div><div class="lab">Average rating</div><div class="val" id="statAvg">&mdash;</div></div>
    <div><div class="lab">With written feedback</div><div class="val" id="statWithText">&mdash;</div></div>
  </div>

  <div class="panel">
    <div class="phead">All feedback</div>
    <div class="pad" id="reviewsList">Loading&hellip;</div>
  </div>
</div>

<script src="/admin/js/admin-common.js"></script>
<script src="/admin/js/reviews.js"></script>
</body>
</html>
